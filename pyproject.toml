[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dspy-security-bench"
version = "0.19.0"
description = "Open mission-assurance commons for secure, authorized, and reviewable AI agents."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Imran Ahamed", email = "immu4989@gmail.com" },
]
requires-python = ">=3.10"
keywords = [
    "dspy",
    "agentdojo",
    "prompt-injection",
    "llm-security",
    "agent-evaluation",
    "agentic-ai",
    "ai-agent-security",
    "ai-security",
    "github-actions",
    "provenance",
    "artifact-attestations",
    "tool-using-agents",
    "robustness",
    "benchmark",
    "procurement",
    "procurement-security",
    "least-privilege",
    "policy-efficacy",
    "paired-evaluation",
    "ai-agent-governance",
    "incident-response",
    "federal-ai",
    "oscal",
    "ai-assurance",
    "mission-pack",
    "source-grounding",
    "citation-faithfulness",
    "agent-identity",
    "delegated-authorization",
    "authorization-conformance",
    "zero-trust",
    "multi-agent-systems",
    "agent-containment",
    "autonomous-agent-collectives",
    "continuous-assurance",
    "ai-acquisition",
    "opentelemetry",
    "agent-observability",
    "mcp-security",
    "race-condition",
    "model-checking",
    "distributed-tracing",
    "causal-inference",
    "mission-economics",
    "ed25519",
    "evidence-provenance",
    "agent-identity-passport",
    "critical-infrastructure-ai",
    "cyber-defense",
    "verified-remediation",
    "cyber-range",
    "critical-infrastructure-resilience",
    "cyber-risk-prioritization",
    "pareto-frontier",
    "assurance-case",
    "claim-evidence-graph",
    "ai-agent-assurance",
    "runtime-containment",
    "ai-sbom",
    "agent-bom",
    "software-supply-chain-security",
    "federal-assessment",
    "evaluation-integrity",
    "benchmark-integrity",
    "holdout-leakage",
    "commit-reveal",
    "in-toto",
    "dsse",
    "multi-party-attestation",
    "separation-of-duties",
    "transparency-log",
    "merkle-tree",
    "key-revocation",
    "checkpoint-gossip",
    "split-view-detection",
    "trust-root-rotation",
    "stale-client-key-rotation",
    "cryptographic-recovery-drill",
    "crypto-agility",
    "continuous-review",
    "review-impact-analysis",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = [
    "dspy>=3.3.0b1",  # ReActV2 requires this beta — released as part of the canonical-tool-call work
    "agentdojo",
    "litellm>=1.50",
    "json-repair>=0.30",
    "pandas>=2.0",
    "numpy>=1.24",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
synthesis = [
    "sentence-transformers>=3.0",
]
dev = [
    "jsonschema>=4.23",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]
signing = [
    "cryptography>=43",
]
openai-agents = [
    "openai-agents>=0.20",
]
langchain = [
    "langchain[openai]>=1.3",
]
pydantic-ai = [
    "pydantic-ai>=2.29",
]
crewai = [
    "crewai>=1.15; python_version < '3.14'",
]
autogen = [
    "autogen-agentchat>=0.7",
    "autogen-ext[openai]>=0.7",
]
frameworks = [
    "openai-agents>=0.20",
    "langchain[openai]>=1.3",
    "pydantic-ai>=2.29",
    "crewai>=1.15; python_version < '3.14'",
    "autogen-agentchat>=0.7",
    "autogen-ext[openai]>=0.7",
]

