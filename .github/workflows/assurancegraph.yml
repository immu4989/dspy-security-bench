name: AssuranceGraph executable case

on:
  push:
    branches: [main]
    paths:
      - "dspy_security_bench/assurance/**"
      - "dspy_security_bench/containment/**"
      - "dspy_security_bench/supplychain/**"
      - "dspy_security_bench/probes/**"
      - "dspy_security_bench/schemas/assurance*.json"
      - "dspy_security_bench/schemas/containmentproof*.json"
      - "dspy_security_bench/schemas/agentbom*.json"
      - "submissions/assurance/**"
      - "tests/test_assurancegraph.py"
      - "tests/test_assurance_*.py"
      - "tests/test_containmentproof.py"
      - "tests/test_agentbom.py"
      - "tests/test_probe_contract.py"
      - "docs/assurancegraph.md"
      - "docs/assurance-control-plane.md"
      - ".github/workflows/assurancegraph.yml"
  pull_request:
    branches: [main]
    paths:
      - "dspy_security_bench/assurance/**"
      - "dspy_security_bench/containment/**"
      - "dspy_security_bench/supplychain/**"
      - "dspy_security_bench/probes/**"
      - "dspy_security_bench/schemas/assurance*.json"
      - "dspy_security_bench/schemas/containmentproof*.json"
      - "dspy_security_bench/schemas/agentbom*.json"
      - "submissions/assurance/**"
      - "tests/test_assurancegraph.py"
      - "tests/test_assurance_*.py"
      - "tests/test_containmentproof.py"
      - "tests/test_agentbom.py"
      - "tests/test_probe_contract.py"
      - "docs/assurancegraph.md"
      - "docs/assurance-control-plane.md"
      - ".github/workflows/assurancegraph.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  executable-case:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.12.3"
      - run: uv python install 3.12
      - run: uv sync --locked --extra dev --python 3.12
      - name: Compile the complete synthetic critical-infrastructure case
        run: >-
          uv run --locked --no-sync dspy-security-bench assure demo
          --out-dir artifacts/assurancegraph
      - name: Recompute the case and every native evidence artifact offline
        run: >-
          uv run --locked --no-sync dspy-security-bench assure verify
          artifacts/assurancegraph/assurance-report.json
          --evidence-root artifacts/assurancegraph
      - name: Exercise harmless containment canaries
        run: >-
          uv run --locked --no-sync dspy-security-bench contain demo
          --out-dir artifacts/containmentproof
      - name: Exercise dependency-to-claim impact
        run: >-
          uv run --locked --no-sync dspy-security-bench bom demo
          --out-dir artifacts/agentbom
      - name: Export and recompute non-certifying federal review inputs
        run: |
          uv run --locked --no-sync dspy-security-bench assure federal-pack \
            artifacts/assurancegraph/assurance-report.json \
            --evidence-root artifacts/assurancegraph \
            --out-dir artifacts/federal-review
          uv run --locked --no-sync dspy-security-bench assure federal-verify \
            artifacts/federal-review \
            --evidence-root artifacts/assurancegraph
      - name: Verify the non-ranking public assurance exchange
        run: uv run --locked --no-sync dspy-security-bench assure exchange-verify
      - name: Exercise schemas, unfavorable outcomes, expiry, and semantic tamper detection
        run: >-
          uv run --locked --no-sync pytest -q
          tests/test_assurancegraph.py
          tests/test_assurance_sectors.py
          tests/test_assurance_federal.py
          tests/test_assurance_exchange.py
          tests/test_containmentproof.py
          tests/test_agentbom.py
          tests/test_probe_contract.py
      - name: Upload review surfaces, control evidence, dependency impact, and review pack
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assurance-control-plane-reference
          path: artifacts
          if-no-files-found: error
          retention-days: 14
