name: ResilienceGraph exact frontier

on:
  push:
    branches: [main]
    paths:
      - "dspy_security_bench/portfolio/**"
      - "dspy_security_bench/defend/**"
      - "dspy_security_bench/schemas/resilience*.json"
      - "tests/test_resiliencegraph.py"
      - "docs/resiliencegraph.md"
      - ".github/workflows/resiliencegraph.yml"
  pull_request:
    branches: [main]
    paths:
      - "dspy_security_bench/portfolio/**"
      - "dspy_security_bench/defend/**"
      - "dspy_security_bench/schemas/resilience*.json"
      - "tests/test_resiliencegraph.py"
      - "docs/resiliencegraph.md"
      - ".github/workflows/resiliencegraph.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-frontier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          version: "0.12.3"
      - run: uv python install 3.12
      - run: uv sync --locked --extra dev --python 3.12
      - name: Recompute the fictional cross-sector frontier
        run: >-
          uv run --locked --no-sync dspy-security-bench portfolio demo
          --out-dir artifacts/resiliencegraph
      - name: Verify the result from the embedded campaign
        run: >-
          uv run --locked --no-sync dspy-security-bench portfolio verify
          artifacts/resiliencegraph/report.json
      - name: Exercise exactness, schemas, tamper detection, and CLI gates
        run: >-
          uv run --locked --no-sync pytest -q tests/test_resiliencegraph.py
      - name: Upload the reviewable decision artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: resiliencegraph-reference-frontier
          path: artifacts/resiliencegraph
          if-no-files-found: error
          retention-days: 14
