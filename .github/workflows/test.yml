name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.12.3"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install locked project dependencies
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}

      - name: Run pytest
        run: uv run --locked --no-sync pytest tests/ -v --tb=short

      - name: Run Ruff
        if: matrix.python-version == '3.12'
        run: uv run --locked --no-sync ruff check dspy_security_bench/ tests/
