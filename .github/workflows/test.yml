name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.12.3"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install locked project dependencies
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}

      - name: Run pytest
        run: >-
          uv run --locked --no-sync pytest tests/ -v --tb=short
          --junitxml=pytest-results.xml

      - name: Expose failed test diagnostics
        if: failure()
        run: python scripts/report_pytest_failures.py pytest-results.xml

      - name: Run Ruff
        if: matrix.python-version == '3.12'
        run: uv run --locked --no-sync ruff check dspy_security_bench/ tests/

  platform-smoke:
    name: ${{ matrix.os }} smoke
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.12.3"
      - run: uv python install 3.12
      - run: uv sync --locked --extra dev --python 3.12
      - name: Exercise offline mission packs and CLI dispatch
        run: >-
          uv run --locked --no-sync pytest -q
          tests/test_incident_twin.py
          tests/test_federalproof.py
          tests/test_missionforge.py
          tests/test_defendertwin.py
          tests/test_resiliencegraph.py
          tests/test_scan_demo.py
          tests/test_scan_comparison.py
          tests/test_scan_study.py
          tests/test_scan_study_html.py
          tests/test_scan_study_record.py
          tests/test_scan_study_bundle.py
          tests/test_continuous_study.py
          tests/test_scan_policy_review.py
          tests/test_scan_policy_html.py
          tests/test_scan_joint_gate.py
          tests/test_scan_yaml_limits.py
          tests/test_agent_tool_budget.py
          tests/test_pytest_diagnostics.py
          tests/test_structural_review.py
          tests/test_proofrun_collection.py
          tests/test_proofrun_junit.py
          tests/test_regular_evidence_io.py
          --junitxml=platform-smoke-results.xml
      - name: Expose failed platform test diagnostics
        if: failure()
        run: python scripts/report_pytest_failures.py platform-smoke-results.xml
