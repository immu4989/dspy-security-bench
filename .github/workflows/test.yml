name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.12.3"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install locked project dependencies
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}

      - name: Run pytest
        run: >-
          uv run --locked --no-sync pytest tests/ -v --tb=short
          --junitxml=pytest-results.xml

      - name: Expose failed test diagnostics
        if: failure()
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          report = Path("pytest-results.xml")
          if not report.exists():
              print("::error title=pytest diagnostics::pytest did not produce a JUnit report")
              raise SystemExit(0)

          def escape(value: str) -> str:
              return value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          def escape_property(value: str) -> str:
              return escape(value).replace(":", "%3A").replace(",", "%2C")

          root = ElementTree.parse(report).getroot()
          failures = root.findall(".//testcase[failure]") + root.findall(".//testcase[error]")
          for case in failures:
              problem = case.find("failure")
              if problem is None:
                  problem = case.find("error")
              details = (problem.text or problem.get("message") or "pytest failure").strip()
              test_id = f"{case.get('classname', '')}.{case.get('name', '')}".strip(".")
              print(f"::error title={escape_property(test_id)}::{escape(details)}")
          PY

      - name: Run Ruff
        if: matrix.python-version == '3.12'
        run: uv run --locked --no-sync ruff check dspy_security_bench/ tests/

  platform-smoke:
    name: ${{ matrix.os }} smoke
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.12.3"
      - run: uv python install 3.12
      - run: uv sync --locked --extra dev --python 3.12
      - name: Exercise offline mission packs and CLI dispatch
        run: >-
          uv run --locked --no-sync pytest -q
          tests/test_incident_twin.py
          tests/test_federalproof.py
          tests/test_missionforge.py
