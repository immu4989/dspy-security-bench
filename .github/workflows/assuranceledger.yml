name: AssuranceLedger trust and interoperability

on:
  push:
    branches: [main]
    paths:
      - "dspy_security_bench/ledger/**"
      - "dspy_security_bench/quorum/**"
      - "dspy_security_bench/schemas/assuranceledger-*.json"
      - "dspy_security_bench/schemas/assurancequorum-*.json"
      - "tests/test_assuranceledger*.py"
      - "tests/test_assurancequorum.py"
      - "docs/assuranceledger.md"
      - "docs/assurancequorum.md"
      - "docs/root-view-quorum.md"
      - "interop/root-view-quorum-v1/**"
      - "interop/root-view-quorum-node/**"
      - ".github/workflows/assuranceledger.yml"
  pull_request:
    branches: [main]
    paths:
      - "dspy_security_bench/ledger/**"
      - "dspy_security_bench/quorum/**"
      - "dspy_security_bench/schemas/assuranceledger-*.json"
      - "dspy_security_bench/schemas/assurancequorum-*.json"
      - "tests/test_assuranceledger*.py"
      - "tests/test_assurancequorum.py"
      - "docs/assuranceledger.md"
      - "docs/assurancequorum.md"
      - "docs/root-view-quorum.md"
      - "interop/root-view-quorum-v1/**"
      - "interop/root-view-quorum-node/**"
      - ".github/workflows/assuranceledger.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  witnessed-trust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          version: "0.12.3"
      - run: uv python install 3.12
      - run: uv sync --locked --extra dev --python 3.12
      - name: Generate the complete fictional witnessed-trust history
        run: >-
          uv run --locked --no-sync dspy-security-bench ledger demo
          --out-dir artifacts/assuranceledger
      - name: Recompute the exact protocol and schema capability contract
        run: >-
          uv run --locked --no-sync dspy-security-bench ledger verify-capabilities
          artifacts/assuranceledger/capability-manifest.json
      - name: Recompute the owner-pinned compatibility check
        run: >-
          uv run --locked --no-sync dspy-security-bench ledger verify-capability-lock
          artifacts/assuranceledger/integration-lock-check.report.json
          artifacts/assuranceledger/integration-lock.json
          artifacts/assuranceledger/capability-manifest.json
      - name: Recompute dual-threshold trust-root continuity
        run: >-
          uv run --locked --no-sync dspy-security-bench ledger verify-trust-root
          artifacts/assuranceledger/trust-root.report.json
      - name: Recompute bounded multi-hop trust-root continuity
        run: >-
          uv run --locked --no-sync dspy-security-bench ledger verify-trust-chain
          artifacts/assuranceledger/trust-root-chain.report.json
      - name: Recompute content-minimized root-recovery readiness
        run: >-
          uv run --locked --no-sync dspy-security-bench ledger verify-recovery-drill
          artifacts/assuranceledger/trust-recovery-drill.report.json
      - name: Recompute authenticated recovery-event handoffs
        run: >-
          uv run --locked --no-sync dspy-security-bench ledger verify-recovery-attestations
          artifacts/assuranceledger/trust-recovery-attestations.report.json
      - name: Recompute independently bounded assurance time
        run: >-
          uv run --locked --no-sync dspy-security-bench ledger verify-time-quorum
          artifacts/assuranceledger/time-quorum.report.json
      - name: Recompute root trust across the complete bounded-time interval
        run: >-
          uv run --locked --no-sync dspy-security-bench ledger verify-trust-root-time
          artifacts/assuranceledger/trust-root-time.report.json
      - name: Recompute independent root-distribution corroboration
        run: >-
          uv run --locked --no-sync dspy-security-bench ledger verify-root-view
          artifacts/assuranceledger/root-view.report.json
      - name: Execute the immutable RootViewQuorum v1 interoperability pack
        run: >-
          uv run --locked --no-sync dspy-security-bench ledger verify-root-view-vectors
          interop/root-view-quorum-v1
      - name: Execute RootViewQuorum vectors through the independent Node.js verifier
        run: >-
          node interop/root-view-quorum-node/verify.mjs
          interop/root-view-quorum-v1
          > artifacts/assuranceledger/root-view-node-interop.json
      - name: Bind and reverify portable cross-implementation evidence
        run: |
          uv run --locked --no-sync dspy-security-bench ledger evaluate-root-view-interop \
            interop/root-view-quorum-v1 \
            artifacts/assuranceledger/root-view-node-interop.json \
            --implementation-source interop/root-view-quorum-node/verify.mjs \
            --implementation-language javascript \
            --out artifacts/assuranceledger/root-view-interop.report.json
          uv run --locked --no-sync dspy-security-bench ledger verify-root-view-interop \
            artifacts/assuranceledger/root-view-interop.report.json \
            interop/root-view-quorum-v1 \
            --implementation-source interop/root-view-quorum-node/verify.mjs
      - name: Recompute sixteen clean-source and adversarial verifier checks
        run: >-
          uv run --locked --no-sync dspy-security-bench ledger verify-conformance
          artifacts/assuranceledger/verifier-conformance.report.json
          --artifact-dir artifacts/assuranceledger
          --evidence-root artifacts/assuranceledger/quorum
      - name: Exercise trust, privacy, schema, drift, and tamper boundaries
        run: >-
          uv run --locked --no-sync pytest -q
          tests/test_assurancequorum.py
          tests/test_assuranceledger.py
          tests/test_assuranceledger_gossip.py
          tests/test_assuranceledger_rereview.py
          tests/test_assuranceledger_fork_proof.py
          tests/test_assuranceledger_consistency_proof.py
          tests/test_assuranceledger_observation.py
          tests/test_assuranceledger_witness_conflict.py
          tests/test_assuranceledger_capabilities.py
          tests/test_assuranceledger_integration_lock.py
          tests/test_assuranceledger_conformance.py
          tests/test_assuranceledger_trust_root.py
          tests/test_assuranceledger_trust_recovery.py
          tests/test_assuranceledger_trust_recovery_attestation.py
          tests/test_assuranceledger_time_quorum.py
          tests/test_assuranceledger_trust_root_time.py
          tests/test_assuranceledger_root_view.py
          tests/test_assuranceledger_root_view_vectors.py
          tests/test_assuranceledger_root_view_interop.py
          tests/test_root_view_node_interop.py
      - name: Preserve reviewable JSON and SARIF evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assuranceledger-reference-evidence
          path: artifacts/assuranceledger
          if-no-files-found: error
          retention-days: 14
      - name: Transfer only the interop report to the clean attestation job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: root-view-interop-unverified-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/assuranceledger/root-view-interop.report.json
          if-no-files-found: error
          retention-days: 1

  attest-root-view-interoperability:
    needs: witnessed-trust
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'immu4989/dspy-security-bench'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download evidence from the read-only evaluation job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: root-view-interop-unverified-${{ github.run_id }}-${{ github.run_attempt }}
          path: trusted-artifacts
      - name: Check out the exact verification engine separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: engine
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          version: "0.12.3"
      - run: uv python install 3.12
      - name: Install only locked verification dependencies
        run: uv sync --project engine --locked --python 3.12
      - name: Recompute interoperability evidence in the clean identity-bearing job
        run: >-
          uv run --project engine --locked --no-sync dspy-security-bench ledger
          verify-root-view-interop
          trusted-artifacts/root-view-interop.report.json
          engine/interop/root-view-quorum-v1
          --implementation-source engine/interop/root-view-quorum-node/verify.mjs
      - name: Attest the exact reverified report with GitHub's workflow identity
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: trusted-artifacts/root-view-interop.report.json
