name: website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "leaderboard/results/**"
      - "leaderboard/benign/**"
      - "submissions/impact/**"
      - "submissions/control/**"
      - "submissions/incident/**"
      - "submissions/source/**"
      - "submissions/authority/**"
      - "submissions/trace/**"
      - "submissions/causal/**"
      - "submissions/collective/**"
      - "submissions/defense/**"
      - "submissions/reproductions.json"
      - "submissions/attestations.json"
      - "dspy_security_bench/defend/evidence.py"
      - "dspy_security_bench/defend/protocol.py"
      - "dspy_security_bench/mission/loader.py"
      - "scripts/generate_site_data.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Direct script execution puts scripts/ on sys.path. Add the checkout root so
      # site generation can import the package without downloading dependencies.
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install site generator dependency
        run: python -m pip install --disable-pip-version-check "PyYAML==6.0.3"
      - name: Regenerate leaderboard data
        run: python scripts/generate_site_data.py
      - name: Verify generated data is committed
        run: git diff --exit-code -- site/data.json
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
