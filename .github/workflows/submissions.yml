name: community submissions

on:
  pull_request:
    branches: [main]
    paths:
      - "submissions/impact/**"
      - "submissions/control/**"
      - "submissions/incident/**"
      - "submissions/source/**"
      - "submissions/authority/**"
      - "submissions/trace/**"
      - "submissions/causal/**"
      - "submissions/collective/**"
      - "submissions/defense/**"
      - "submissions/reproductions.json"
      - "submissions/attestations.json"
      - "scripts/validate_impact_submissions.py"
      - "tests/test_submission_ci_intake.py"
      - "dspy_security_bench/jsonio.py"
      - "dspy_security_bench/procurement/**"
      - "dspy_security_bench/incident/**"
      - "dspy_security_bench/mission/**"
      - "dspy_security_bench/authority/**"
      - "dspy_security_bench/trace/**"
      - "dspy_security_bench/causal/**"
      - "dspy_security_bench/collective/**"
      - "dspy_security_bench/defend/**"
      - "dspy_security_bench/proofrun.py"
      - "dspy_security_bench/schemas/**"
  push:
    branches: [main]
    paths:
      - "submissions/impact/**"
      - "submissions/control/**"
      - "submissions/incident/**"
      - "submissions/source/**"
      - "submissions/authority/**"
      - "submissions/trace/**"
      - "submissions/causal/**"
      - "submissions/collective/**"
      - "submissions/defense/**"
      - "submissions/reproductions.json"
      - "submissions/attestations.json"
      - "scripts/validate_impact_submissions.py"
      - "tests/test_submission_ci_intake.py"
      - "dspy_security_bench/jsonio.py"
      - "dspy_security_bench/procurement/**"
      - "dspy_security_bench/incident/**"
      - "dspy_security_bench/mission/**"
      - "dspy_security_bench/authority/**"
      - "dspy_security_bench/trace/**"
      - "dspy_security_bench/causal/**"
      - "dspy_security_bench/collective/**"
      - "dspy_security_bench/defend/**"
      - "dspy_security_bench/proofrun.py"
      - "dspy_security_bench/schemas/**"
  workflow_dispatch:

permissions:
  contents: read
  attestations: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          version: "0.12.3"
      - run: uv python install 3.12
      - run: uv sync --locked --extra dev --python 3.12
      - name: Exercise untrusted submission intake boundaries
        run: uv run --locked --no-sync pytest -q tests/test_submission_ci_intake.py
      - name: Recompute and verify every submission
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked --no-sync python scripts/validate_impact_submissions.py
