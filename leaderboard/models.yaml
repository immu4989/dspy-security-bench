# Leaderboard model registry (protocol v2).
#
# Each entry is one model to measure under leaderboard/protocol.yaml. `model_id`
# MUST be a pinned version string (never a "-latest" alias) so a row means one
# thing forever. To propose a model, open an "Add model" issue; the maintainer
# runs the frozen runner and commits the result.
#
# The roster routes through OpenRouter (one key, OPENROUTER_API_KEY) so a single
# gateway reaches every family — and so Gemini and Mistral, which are broken or
# quota-exhausted on their native endpoints, are still reachable. `tier` notes
# whether a model draws OpenRouter credit (paid) or a shared free daily cap.

models:
  # --- DeepSeek ---
  - model_id: openrouter/deepseek/deepseek-v3.2
    family: DeepSeek
    display_name: DeepSeek V3.2
    provider_env: OPENROUTER_API_KEY
    tier: paid

  # --- Mistral (headline within-family pair) ---
  - model_id: openrouter/mistralai/mistral-large-2512
    family: Mistral
    display_name: Mistral Large
    provider_env: OPENROUTER_API_KEY
    tier: paid

  # --- Meta ---
  - model_id: openrouter/meta-llama/llama-3.3-70b-instruct
    family: Meta
    display_name: Llama 3.3 70B
    provider_env: OPENROUTER_API_KEY
    tier: paid

  # --- Alibaba ---
  - model_id: openrouter/qwen/qwen3-235b-a22b-2507
    family: Alibaba
    display_name: Qwen3 235B
    provider_env: OPENROUTER_API_KEY
    tier: paid

  # --- NVIDIA (within-family capability curve: Super 120B vs Nano 30B) ---
  - model_id: openrouter/nvidia/nemotron-3-super-120b-a12b
    family: NVIDIA
    display_name: Nemotron 3 Super 120B
    provider_env: OPENROUTER_API_KEY
    tier: paid

  - model_id: openrouter/nvidia/nemotron-3-nano-30b-a3b:free
    family: NVIDIA
    display_name: Nemotron 3 Nano 30B
    provider_env: OPENROUTER_API_KEY
    tier: free

  # --- Google (reached via OpenRouter, sidestepping the AQ-key bug) ---
  - model_id: openrouter/google/gemini-2.5-flash-lite
    family: Google
    display_name: Gemini 2.5 Flash Lite
    provider_env: OPENROUTER_API_KEY
    tier: paid

  # --- OpenAI open-weights ---
  - model_id: openrouter/openai/gpt-oss-20b
    family: OpenAI-OSS
    display_name: gpt-oss-20b
    provider_env: OPENROUTER_API_KEY
    tier: paid

  # --- OpenAI (also the model the original v0.1 probe used, so the frozen
  # protocol now gives it a directly comparable row) ---
  - model_id: openrouter/openai/gpt-4o-mini
    family: OpenAI
    display_name: gpt-4o-mini
    provider_env: OPENROUTER_API_KEY
    tier: paid

  # --- Anthropic ---
  - model_id: openrouter/anthropic/claude-sonnet-4.5
    family: Anthropic
    display_name: Claude Sonnet 4.5
    provider_env: OPENROUTER_API_KEY
    tier: paid

  # --- current-generation additions ---
  - model_id: openrouter/meta-llama/llama-4-maverick
    family: Meta
    display_name: Llama 4 Maverick
    provider_env: OPENROUTER_API_KEY
    tier: paid

  - model_id: openrouter/mistralai/mistral-medium-3.1
    family: Mistral
    display_name: Mistral Medium 3.1
    provider_env: OPENROUTER_API_KEY
    tier: paid

  - model_id: openrouter/openai/gpt-5.4-mini
    family: OpenAI
    display_name: GPT-5.4 mini
    provider_env: OPENROUTER_API_KEY
    tier: paid
    # Reasoning model: does not advertise `temperature` support, so the strict
    # require_parameters routing filters out every endpoint.
    routing: relaxed

  - model_id: openrouter/x-ai/grok-4.3
    family: xAI
    display_name: Grok 4.3
    provider_env: OPENROUTER_API_KEY
    tier: paid
    routing: relaxed

# Excluded: anthropic/claude-3-haiku — a 2024 model that does not support the
# structured-output (json_schema) requests DSPy's adapter issues, so OpenRouter
# has no endpoint able to serve the scaffold. Simple tool calls succeed, which
# is why it runs for a while before failing. Anthropic is represented by
# Claude Sonnet 4.5.
# Excluded: inclusionai/ling-3.0-flash — does not support tool-calling /
# structured outputs, which the ReAct scaffold requires, so it cannot be
# measured under this protocol.
