# Generated by `dspy-security-bench init`.
# Docs: https://github.com/immu4989/dspy-security-bench/blob/main/docs/ci.md
agent:
{{ agent }}

scan:
  suites: [workspace]
  attacks: [direct, important_instructions]
  defenses: [none]
  user_tasks: 5
  injection_tasks: 1

gate:
  mode: absolute
  min_security: 0.90

report:
  formats: [terminal, json, sarif]
  json_out: dsb.json
  sarif_out: dsb.sarif

fail_on: error
