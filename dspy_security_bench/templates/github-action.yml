# Generated by `dspy-security-bench init`.
name: injection-scan

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install scanner and agent
        run: |
{{ project install }}          pip install dspy-security-bench
      - name: Show scan plan
        run: dspy-security-bench scan --config .dspy-security-bench.yaml --plan
      - name: Run injection scan
        env:
{{ provider env }}
        run: dspy-security-bench scan --config .dspy-security-bench.yaml --sarif dsb.sarif
      - name: Upload SARIF
        if: always() && hashFiles('dsb.sarif') != ''
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: dsb.sarif
