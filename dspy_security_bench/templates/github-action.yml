# Generated by `dspy-security-bench init`.
name: injection-scan

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scanner and agent
        run: |
{{ project install }}          pip install dspy-security-bench
      - name: Show scan plan
        run: dspy-security-bench scan --config .dspy-security-bench.yaml --plan
      - name: Run injection scan
        env:
{{ provider env }}
        run: dspy-security-bench scan --config .dspy-security-bench.yaml --sarif dsb.sarif
      - name: Upload SARIF
        if: always() && hashFiles('dsb.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: dsb.sarif
