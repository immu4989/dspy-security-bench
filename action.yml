name: "DSPy Security Bench ProofRun"
description: "Run Impact, Control, or Incident ProofRun, gate uncertainty, and attest evidence."
author: "Imran Ahamed"
branding:
  icon: "shield"
  color: "purple"

inputs:
  evidence-kind:
    description: "Evidence experiment: impact, control, or incident"
    required: false
    default: "impact"
  agent:
    description: "Python module:callable returning a fresh Agent"
    required: true
  trials:
    description: "Complete five-pair RepeatTwin trials"
    required: false
    default: "10"
  confidence:
    description: "Wilson interval confidence level"
    required: false
    default: "0.95"
  min-lower-bound:
    description: "Fail after preserving evidence when the lower bound is below this value"
    required: false
    default: "0.0"
  policy:
    description: "Repository-relative tool-policy YAML; required for control evidence"
    required: false
    default: ""
  policy-source:
    description: "Public HTTPS URL for the exact policy; required for control evidence"
    required: false
    default: ""
  approval-handler:
    description: "Optional module:callable approval handler for control evidence"
    required: false
    default: ""
  min-containment-lower-bound:
    description: "Control gate: minimum harm-containment Wilson lower bound"
    required: false
    default: "0.0"
  min-controlled-harm-free-lower-bound:
    description: "Control gate: minimum policy-on harm-free Wilson lower bound"
    required: false
    default: "0.0"
  min-clean-preservation-lower-bound:
    description: "Control gate: minimum clean-utility-preservation Wilson lower bound"
    required: false
    default: "0.0"
  min-controlled-resistance-lower-bound:
    description: "Control gate: minimum policy-on attack-resistance Wilson lower bound"
    required: false
    default: "0.0"
  max-unstable-pairs:
    description: "Control gate: maximum pair effects that vary across trials"
    required: false
    default: "5"
  submitter:
    description: "Public GitHub handle or organization; defaults to the workflow actor"
    required: false
    default: ""
  agent-source:
    description: "Public HTTPS source/configuration URL; defaults to the evaluated commit"
    required: false
    default: ""
  notes:
    description: "Short public context included in the result bundle"
    required: false
    default: ""
  output:
    description: "Attested bundle path"
    required: false
    default: "proofrun.json"
  card-output:
    description: "Shareable SVG path for control evidence"
    required: false
    default: "proofrun-control.svg"
  artifact-name:
    description: "GitHub Actions artifact name"
    required: false
    default: "proofrun-evidence"
  python-version:
    description: "Python runtime"
    required: false
    default: "3.12"
  install-project:
    description: "Install the caller repository as an editable Python package"
    required: false
    default: "true"
  upload-artifact:
    description: "Upload the bundle to the workflow run"
    required: false
    default: "true"
  attest:
    description: "Create GitHub/Sigstore build provenance for the exact bundle"
    required: false
    default: "true"

outputs:
  evidence-kind:
    description: "Generated evidence kind: impact, control, or incident"
    value: ${{ steps.metadata.outputs.evidence-kind }}
  bundle-path:
    description: "Path to the generated evidence bundle"
    value: ${{ inputs.output }}
  bundle-sha256:
    description: "Canonical SHA-256 stored in the bundle"
    value: ${{ steps.metadata.outputs.bundle-sha256 }}
  attack-resistance:
    description: "Observed attack-resistance rate"
    value: ${{ steps.metadata.outputs.attack-resistance }}
  lower-bound:
    description: "Primary Wilson lower bound: resistance for impact/incident, containment for control"
    value: ${{ steps.metadata.outputs.lower-bound }}
  containment:
    description: "Observed harm-containment rate for control evidence"
    value: ${{ steps.metadata.outputs.containment }}
  containment-lower-bound:
    description: "Harm-containment Wilson lower bound for control evidence"
    value: ${{ steps.metadata.outputs.containment-lower-bound }}
  safe-recovery:
    description: "Observed safe mission recovery for control evidence"
    value: ${{ steps.metadata.outputs.safe-recovery }}
  clean-preservation:
    description: "Observed clean utility preservation for control evidence"
    value: ${{ steps.metadata.outputs.clean-preservation }}
  attestation-url:
    description: "GitHub artifact-attestation summary URL"
    value: ${{ steps.attest.outputs.attestation-url }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install evaluated project
      if: inputs.install-project == 'true'
      run: python -m pip install -e .
      shell: bash

    - name: Install ProofRun engine from this action ref
      run: python -m pip install "$GITHUB_ACTION_PATH"
      shell: bash

    - name: Run the selected experiment and preserve the evidence envelope
      id: run
      continue-on-error: true
      shell: bash
      env:
        PROOFRUN_EVIDENCE_KIND: ${{ inputs.evidence-kind }}
        PROOFRUN_AGENT: ${{ inputs.agent }}
        PROOFRUN_TRIALS: ${{ inputs.trials }}
        PROOFRUN_CONFIDENCE: ${{ inputs.confidence }}
        PROOFRUN_MIN_LOWER_BOUND: ${{ inputs.min-lower-bound }}
        PROOFRUN_POLICY: ${{ inputs.policy }}
        PROOFRUN_POLICY_SOURCE: ${{ inputs.policy-source }}
        PROOFRUN_APPROVAL_HANDLER: ${{ inputs.approval-handler }}
        PROOFRUN_MIN_CONTAINMENT: ${{ inputs.min-containment-lower-bound }}
        PROOFRUN_MIN_CONTROLLED_HARM_FREE: ${{ inputs.min-controlled-harm-free-lower-bound }}
        PROOFRUN_MIN_CLEAN_PRESERVATION: ${{ inputs.min-clean-preservation-lower-bound }}
        PROOFRUN_MIN_CONTROLLED_RESISTANCE: ${{ inputs.min-controlled-resistance-lower-bound }}
        PROOFRUN_MAX_UNSTABLE_PAIRS: ${{ inputs.max-unstable-pairs }}
        PROOFRUN_SUBMITTER: ${{ inputs.submitter }}
        PROOFRUN_AGENT_SOURCE: ${{ inputs.agent-source }}
        PROOFRUN_NOTES: ${{ inputs.notes }}
        PROOFRUN_OUTPUT: ${{ inputs.output }}
        PROOFRUN_CARD_OUTPUT: ${{ inputs.card-output }}
        PROOFRUN_BUILDER_KIND: "caller_workflow"
        PROOFRUN_ACTION_REF: ${{ github.action_ref }}
        PROOFRUN_RUNNER_ENVIRONMENT: ${{ runner.environment }}
      run: |
        submitter="$PROOFRUN_SUBMITTER"
        agent_source="$PROOFRUN_AGENT_SOURCE"
        if [[ -z "$submitter" ]]; then submitter="@$GITHUB_ACTOR"; fi
        if [[ -z "$agent_source" ]]; then
          agent_source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/$GITHUB_SHA"
        fi
        if [[ "$PROOFRUN_EVIDENCE_KIND" == "impact" ]]; then
          dspy-security-bench proofrun run \
            --agent "$PROOFRUN_AGENT" \
            --trials "$PROOFRUN_TRIALS" \
            --confidence "$PROOFRUN_CONFIDENCE" \
            --min-lower-bound "$PROOFRUN_MIN_LOWER_BOUND" \
            --submitter "$submitter" \
            --agent-source "$agent_source" \
            --notes "$PROOFRUN_NOTES" \
            --out "$PROOFRUN_OUTPUT"
        elif [[ "$PROOFRUN_EVIDENCE_KIND" == "control" ]]; then
          if [[ -z "$PROOFRUN_POLICY" || -z "$PROOFRUN_POLICY_SOURCE" ]]; then
            echo "control evidence requires policy and policy-source" >&2
            exit 2
          fi
          approval_args=()
          if [[ -n "$PROOFRUN_APPROVAL_HANDLER" ]]; then
            approval_args=(--approval-handler "$PROOFRUN_APPROVAL_HANDLER")
          fi
          dspy-security-bench proofrun control \
            --agent "$PROOFRUN_AGENT" \
            --policy "$PROOFRUN_POLICY" \
            --policy-source "$PROOFRUN_POLICY_SOURCE" \
            "${approval_args[@]}" \
            --trials "$PROOFRUN_TRIALS" \
            --confidence "$PROOFRUN_CONFIDENCE" \
            --min-containment-lower-bound "$PROOFRUN_MIN_CONTAINMENT" \
            --min-controlled-harm-free-lower-bound "$PROOFRUN_MIN_CONTROLLED_HARM_FREE" \
            --min-clean-preservation-lower-bound "$PROOFRUN_MIN_CLEAN_PRESERVATION" \
            --min-controlled-resistance-lower-bound "$PROOFRUN_MIN_CONTROLLED_RESISTANCE" \
            --max-unstable-pairs "$PROOFRUN_MAX_UNSTABLE_PAIRS" \
            --submitter "$submitter" \
            --agent-source "$agent_source" \
            --notes "$PROOFRUN_NOTES" \
            --out "$PROOFRUN_OUTPUT" \
            --card-out "$PROOFRUN_CARD_OUTPUT"
        elif [[ "$PROOFRUN_EVIDENCE_KIND" == "incident" ]]; then
          dspy-security-bench proofrun incident \
            --agent "$PROOFRUN_AGENT" \
            --trials "$PROOFRUN_TRIALS" \
            --confidence "$PROOFRUN_CONFIDENCE" \
            --min-lower-bound "$PROOFRUN_MIN_LOWER_BOUND" \
            --submitter "$submitter" \
            --agent-source "$agent_source" \
            --notes "$PROOFRUN_NOTES" \
            --out "$PROOFRUN_OUTPUT"
        else
          echo "evidence-kind must be impact, control, or incident" >&2
          exit 2
        fi

    - name: Inspect generated bundle
      id: bundle
      if: always()
      shell: bash
      env:
        PROOFRUN_OUTPUT: ${{ inputs.output }}
      run: |
        if [[ -f "$PROOFRUN_OUTPUT" ]]; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Export result metadata
      id: metadata
      if: steps.bundle.outputs.exists == 'true'
      shell: bash
      env:
        PROOFRUN_OUTPUT: ${{ inputs.output }}
      run: python "$GITHUB_ACTION_PATH/scripts/proofrun_action_metadata.py" "$PROOFRUN_OUTPUT"

    - name: Attest exact ProofRun evidence
      id: attest
      if: inputs.attest == 'true' && steps.bundle.outputs.exists == 'true'
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-path: ${{ inputs.output }}

    - name: Upload ProofRun evidence
      if: inputs.upload-artifact == 'true' && steps.bundle.outputs.exists == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ inputs.output }}
          ${{ inputs.card-output }}
        if-no-files-found: error

    - name: Enforce ProofRun gate after preserving evidence
      if: steps.run.outcome != 'success'
      shell: bash
      run: exit 1
